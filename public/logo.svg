<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="bk-logo-title bk-logo-desc">
  <title id="bk-logo-title">Claude Code Public Builder Kit</title>
  <desc id="bk-logo-desc">An open plan: three sheets fanning out behind a front page with a structured header and content lines. The fan motion suggests a single idea unfolding into a complete planning document set.</desc>

  <defs>
    <linearGradient id="bk-front-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0eaff"/>
      <stop offset="100%" stop-color="#a4c2ff"/>
    </linearGradient>
    <linearGradient id="bk-mid-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9bbeff"/>
      <stop offset="100%" stop-color="#7aa8ff"/>
    </linearGradient>
    <linearGradient id="bk-back-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa8ff"/>
      <stop offset="100%" stop-color="#5e8eff"/>
    </linearGradient>
    <radialGradient id="bk-aura-grad" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="rgba(138, 180, 255, 0.55)"/>
      <stop offset="60%" stop-color="rgba(138, 180, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(138, 180, 255, 0)"/>
    </radialGradient>
  </defs>

  <style>
    .bk-aura   { transform-origin: 128px 128px; animation: bk-aura-breathe 5.6s ease-in-out infinite; }
    .bk-title  { animation: bk-title-pulse 4.8s ease-in-out infinite; }
    .bk-back-l { transform-origin: 127px 200px; animation: bk-fan-l 6.4s ease-in-out infinite; }
    .bk-back-r { transform-origin: 129px 200px; animation: bk-fan-r 6.4s ease-in-out infinite; }
    @keyframes bk-aura-breathe {
      0%, 100% { transform: scale(1);    opacity: 0.55; }
      50%      { transform: scale(1.06); opacity: 0.85; }
    }
    @keyframes bk-title-pulse {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1; }
    }
    @keyframes bk-fan-l {
      0%, 100% { transform: rotate(-8deg); }
      50%      { transform: rotate(-10deg); }
    }
    @keyframes bk-fan-r {
      0%, 100% { transform: rotate(8deg); }
      50%      { transform: rotate(10deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bk-aura, .bk-title, .bk-back-l, .bk-back-r { animation: none; }
    }
  </style>

  <!-- Aura -->
  <circle class="bk-aura" cx="128" cy="128" r="118" fill="url(#bk-aura-grad)"/>

  <!-- Back sheets fanning out behind the front -->
  <g class="bk-back-l">
    <rect x="78" y="62" width="98" height="140" rx="6" fill="url(#bk-back-fill)" opacity="0.55"/>
  </g>
  <g class="bk-back-r">
    <rect x="80" y="62" width="98" height="140" rx="6" fill="url(#bk-mid-fill)" opacity="0.7"/>
  </g>

  <!-- Front sheet -->
  <g>
    <rect x="80" y="60" width="96" height="140" rx="6" fill="url(#bk-front-fill)"
          stroke="#c8d8ff" stroke-width="0.8"/>

    <rect class="bk-title" x="92" y="74" width="56" height="6" rx="2" fill="#5e8eff"/>

    <rect x="92" y="92"  width="72" height="3" rx="1.5" fill="#7aa8ff" opacity="0.6"/>
    <rect x="92" y="100" width="64" height="3" rx="1.5" fill="#7aa8ff" opacity="0.6"/>
    <rect x="92" y="108" width="68" height="3" rx="1.5" fill="#7aa8ff" opacity="0.6"/>

    <rect x="92" y="124" width="44" height="5" rx="2"   fill="#5e8eff" opacity="0.7"/>
    <rect x="92" y="138" width="68" height="3" rx="1.5" fill="#7aa8ff" opacity="0.55"/>
    <rect x="92" y="146" width="60" height="3" rx="1.5" fill="#7aa8ff" opacity="0.55"/>
    <rect x="92" y="154" width="64" height="3" rx="1.5" fill="#7aa8ff" opacity="0.55"/>

    <rect x="92" y="170" width="38" height="5" rx="2"   fill="#5e8eff" opacity="0.55"/>
    <rect x="92" y="184" width="58" height="3" rx="1.5" fill="#7aa8ff" opacity="0.4"/>
  </g>
</svg>
