<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="bk-mono-title bk-mono-desc" fill="currentColor">
  <title id="bk-mono-title">Claude Code Public Builder Kit</title>
  <desc id="bk-mono-desc">An open plan: three sheets fanning out behind a structured front page. Monochrome variant for print, single-colour rendering, and contexts where the gradient version is unavailable.</desc>

  <!-- Back sheets, fanning -->
  <g transform="rotate(-8 127 200)" opacity="0.35">
    <rect x="78" y="62" width="98" height="140" rx="6"/>
  </g>
  <g transform="rotate(8 129 200)" opacity="0.55">
    <rect x="80" y="62" width="98" height="140" rx="6"/>
  </g>

  <!-- Front sheet outline -->
  <rect x="80" y="60" width="96" height="140" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Content -->
  <rect x="92" y="74"  width="56" height="6" rx="2"/>
  <rect x="92" y="92"  width="72" height="3" rx="1.5" opacity="0.6"/>
  <rect x="92" y="100" width="64" height="3" rx="1.5" opacity="0.6"/>
  <rect x="92" y="108" width="68" height="3" rx="1.5" opacity="0.6"/>
  <rect x="92" y="124" width="44" height="5" rx="2"   opacity="0.8"/>
  <rect x="92" y="138" width="68" height="3" rx="1.5" opacity="0.55"/>
  <rect x="92" y="146" width="60" height="3" rx="1.5" opacity="0.55"/>
  <rect x="92" y="154" width="64" height="3" rx="1.5" opacity="0.55"/>
  <rect x="92" y="170" width="38" height="5" rx="2"   opacity="0.7"/>
  <rect x="92" y="184" width="58" height="3" rx="1.5" opacity="0.4"/>
</svg>
