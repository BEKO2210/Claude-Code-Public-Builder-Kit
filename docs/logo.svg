<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="bk-logo-title bk-logo-desc">
  <title id="bk-logo-title">Claude Code Public Builder Kit</title>
  <desc id="bk-logo-desc">A twelve-pointed compass star: twelve rays — one per generated file — with four longer cardinal points marking the directions of orientation.</desc>
  <defs>
    <linearGradient id="bk-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#a4c2ff"/>
      <stop offset="55%" stop-color="#8ab4ff"/>
      <stop offset="100%" stop-color="#6c9bff"/>
    </linearGradient>
    <radialGradient id="bk-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bk-northglow" cx="50%" cy="0%" r="55%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style><![CDATA[
      .bk-star  { transform-origin: 32px 32px; animation: bk-breathe 4.8s ease-in-out infinite; }
      .bk-shine { transform-origin: 32px 32px; animation: bk-shine   4.8s ease-in-out infinite; }
      .bk-north { transform-origin: 32px 32px; animation: bk-north   6.4s ease-in-out infinite; }
      @keyframes bk-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.035); }
      }
      @keyframes bk-shine {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 0.95; }
      }
      @keyframes bk-north {
        0%, 100% { opacity: 0.30; }
        50%      { opacity: 0.85; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bk-star, .bk-shine, .bk-north { animation: none; }
      }
    ]]></style>
  </defs>
  <g class="bk-star">
    <polygon
      points="32,4 34.33,23.31 43,12.95 38.36,25.64 51.05,21 40.69,29.67 60,32 40.69,34.33 51.05,43 38.36,38.36 43,51.05 34.33,40.69 32,60 29.67,40.69 21,51.05 25.64,38.36 12.95,43 23.31,34.33 4,32 23.31,29.67 12.95,21 25.64,25.64 21,12.95 29.67,23.31"
      fill="url(#bk-grad)"
      stroke="#cdd9ff"
      stroke-width="0.75"
      stroke-linejoin="round"
    />
    <polygon
      class="bk-shine"
      points="32,4 34.33,23.31 43,12.95 38.36,25.64 51.05,21 40.69,29.67 60,32 40.69,34.33 51.05,43 38.36,38.36 43,51.05 34.33,40.69 32,60 29.67,40.69 21,51.05 25.64,38.36 12.95,43 23.31,34.33 4,32 23.31,29.67 12.95,21 25.64,25.64 21,12.95 29.67,23.31"
      fill="url(#bk-glow)"
    />
    <circle class="bk-north" cx="32" cy="9" r="6" fill="url(#bk-northglow)"/>
  </g>
</svg>
