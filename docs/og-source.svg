<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Builder Kit — Open Graph card">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#161a22"/>
    </linearGradient>
    <radialGradient id="og-aura1" cx="20%" cy="35%" r="35%">
      <stop offset="0%"  stop-color="#8ab4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8ab4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-aura2" cx="78%" cy="78%" r="40%">
      <stop offset="0%"  stop-color="#6c9bff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6c9bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-front-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0eaff"/>
      <stop offset="100%" stop-color="#a4c2ff"/>
    </linearGradient>
    <linearGradient id="og-mid-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9bbeff"/>
      <stop offset="100%" stop-color="#7aa8ff"/>
    </linearGradient>
    <linearGradient id="og-back-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa8ff"/>
      <stop offset="100%" stop-color="#5e8eff"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="rgba(138, 180, 255, 0.35)"/>
      <stop offset="100%" stop-color="rgba(138, 180, 255, 0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-aura1)"/>
  <rect width="1200" height="630" fill="url(#og-aura2)"/>

  <!-- Logo: open-plan, scaled 1.55× from the 256-unit native viewBox.
       Centre at (300, 315). Native (128,128) → translate(-128 * 1.55, -128 * 1.55) = (-198.4, -198.4).
       Final transform shifts the logo so its centre lands at (300, 315). -->
  <g transform="translate(300 315) scale(1.55) translate(-128 -128)">
    <circle cx="128" cy="128" r="118" fill="url(#og-glow)"/>

    <!-- Back sheets -->
    <g transform="rotate(-8 127 200)" opacity="0.55">
      <rect x="78" y="62" width="98" height="140" rx="6" fill="url(#og-back-fill)"/>
    </g>
    <g transform="rotate(8 129 200)" opacity="0.7">
      <rect x="80" y="62" width="98" height="140" rx="6" fill="url(#og-mid-fill)"/>
    </g>

    <!-- Front sheet -->
    <rect x="80" y="60" width="96" height="140" rx="6" fill="url(#og-front-fill)" stroke="#c8d8ff" stroke-width="0.8"/>

    <!-- Content -->
    <rect x="92" y="74"  width="56" height="6" rx="2" fill="#5e8eff"/>
    <rect x="92" y="92"  width="72" height="3" rx="1.5" fill="#7aa8ff" opacity="0.65"/>
    <rect x="92" y="100" width="64" height="3" rx="1.5" fill="#7aa8ff" opacity="0.65"/>
    <rect x="92" y="108" width="68" height="3" rx="1.5" fill="#7aa8ff" opacity="0.65"/>
    <rect x="92" y="124" width="44" height="5" rx="2"   fill="#5e8eff" opacity="0.75"/>
    <rect x="92" y="138" width="68" height="3" rx="1.5" fill="#7aa8ff" opacity="0.55"/>
    <rect x="92" y="146" width="60" height="3" rx="1.5" fill="#7aa8ff" opacity="0.55"/>
    <rect x="92" y="154" width="64" height="3" rx="1.5" fill="#7aa8ff" opacity="0.55"/>
    <rect x="92" y="170" width="38" height="5" rx="2"   fill="#5e8eff" opacity="0.6"/>
    <rect x="92" y="184" width="58" height="3" rx="1.5" fill="#7aa8ff" opacity="0.4"/>
  </g>

  <!-- Eyebrow tag -->
  <g transform="translate(540 195)">
    <rect x="0" y="0" rx="22" ry="22" width="280" height="44" fill="rgba(138,180,255,0.12)" stroke="rgba(138,180,255,0.35)" stroke-width="1"/>
    <text x="22" y="29" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="1.2" fill="#a4c2ff">FREE · NO INSTALL · 30 SECONDS</text>
  </g>

  <!-- Headline -->
  <text x="540" y="305" font-family="system-ui, -apple-system, 'DejaVu Sans', sans-serif" font-size="54" font-weight="700" fill="#e7ebf3" letter-spacing="-1">From one sentence</text>
  <text x="540" y="365" font-family="system-ui, -apple-system, 'DejaVu Sans', sans-serif" font-size="54" font-weight="700" fill="#e7ebf3" letter-spacing="-1">to a complete</text>
  <text x="540" y="425" font-family="system-ui, -apple-system, 'DejaVu Sans', sans-serif" font-size="54" font-weight="700" fill="#8ab4ff" letter-spacing="-1">project plan.</text>

  <!-- Tagline -->
  <text x="540" y="475" font-family="system-ui, -apple-system, 'DejaVu Sans', sans-serif" font-size="22" fill="#8a93a6">12 ready-to-use planning documents. Drop into Claude. Start building.</text>

  <!-- Brand line -->
  <text x="540" y="555" font-family="system-ui, -apple-system, 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" fill="#e7ebf3">Builder Kit</text>
</svg>
