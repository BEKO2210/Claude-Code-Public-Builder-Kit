<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Claude Code Public Builder Kit — Open Graph card">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#161a22"/>
    </linearGradient>
    <radialGradient id="og-aura1" cx="20%" cy="35%" r="35%">
      <stop offset="0%"  stop-color="#8ab4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8ab4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-aura2" cx="78%" cy="78%" r="40%">
      <stop offset="0%"  stop-color="#6c9bff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6c9bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#a4c2ff"/>
      <stop offset="55%" stop-color="#8ab4ff"/>
      <stop offset="100%" stop-color="#5e8eff"/>
    </linearGradient>
    <linearGradient id="og-petal-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#c8d8ff"/>
      <stop offset="55%" stop-color="#a4c2ff"/>
      <stop offset="100%" stop-color="#7aa8ff"/>
    </linearGradient>
    <radialGradient id="og-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#cdd9ff"/>
      <stop offset="100%" stop-color="#8ab4ff"/>
    </radialGradient>
    <radialGradient id="og-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#8ab4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8ab4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-aura1)"/>
  <rect width="1200" height="630" fill="url(#og-aura2)"/>

  <!-- Logo: 12-petal compass bloom, scaled up. Source viewBox 0 0 64 64. -->
  <!-- We translate so the logo center sits at (300, 315), scale 6.5× → outer radius ≈ 28*6.5 = 182px -->
  <g transform="translate(300 315) scale(6.5)">
    <circle cx="0" cy="0" r="32" fill="url(#og-glow)"/>
    <g>
      <g transform="rotate(0)"><path d="M 0,-4 C 3,-13 3.5,-21 0,-28 C -3.5,-21 -3,-13 0,-4 Z" fill="url(#og-petal-c)"/></g>
      <g transform="rotate(30)"><path d="M 0,-4 C 2.5,-10 3,-16 0,-22 C -3,-16 -2.5,-10 0,-4 Z" fill="url(#og-petal)" opacity="0.9"/></g>
      <g transform="rotate(60)"><path d="M 0,-4 C 2.5,-10 3,-16 0,-22 C -3,-16 -2.5,-10 0,-4 Z" fill="url(#og-petal)" opacity="0.9"/></g>
      <g transform="rotate(90)"><path d="M 0,-4 C 3,-13 3.5,-21 0,-28 C -3.5,-21 -3,-13 0,-4 Z" fill="url(#og-petal-c)"/></g>
      <g transform="rotate(120)"><path d="M 0,-4 C 2.5,-10 3,-16 0,-22 C -3,-16 -2.5,-10 0,-4 Z" fill="url(#og-petal)" opacity="0.9"/></g>
      <g transform="rotate(150)"><path d="M 0,-4 C 2.5,-10 3,-16 0,-22 C -3,-16 -2.5,-10 0,-4 Z" fill="url(#og-petal)" opacity="0.9"/></g>
      <g transform="rotate(180)"><path d="M 0,-4 C 3,-13 3.5,-21 0,-28 C -3.5,-21 -3,-13 0,-4 Z" fill="url(#og-petal-c)"/></g>
      <g transform="rotate(210)"><path d="M 0,-4 C 2.5,-10 3,-16 0,-22 C -3,-16 -2.5,-10 0,-4 Z" fill="url(#og-petal)" opacity="0.9"/></g>
      <g transform="rotate(240)"><path d="M 0,-4 C 2.5,-10 3,-16 0,-22 C -3,-16 -2.5,-10 0,-4 Z" fill="url(#og-petal)" opacity="0.9"/></g>
      <g transform="rotate(270)"><path d="M 0,-4 C 3,-13 3.5,-21 0,-28 C -3.5,-21 -3,-13 0,-4 Z" fill="url(#og-petal-c)"/></g>
      <g transform="rotate(300)"><path d="M 0,-4 C 2.5,-10 3,-16 0,-22 C -3,-16 -2.5,-10 0,-4 Z" fill="url(#og-petal)" opacity="0.9"/></g>
      <g transform="rotate(330)"><path d="M 0,-4 C 2.5,-10 3,-16 0,-22 C -3,-16 -2.5,-10 0,-4 Z" fill="url(#og-petal)" opacity="0.9"/></g>
    </g>
    <circle cx="0" cy="0" r="3" fill="url(#og-core)"/>
  </g>

  <!-- Eyebrow tag -->
  <g transform="translate(540 195)">
    <rect x="0" y="0" rx="22" ry="22" width="290" height="44" fill="rgba(138,180,255,0.12)" stroke="rgba(138,180,255,0.35)" stroke-width="1"/>
    <text x="22" y="29" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="1.2" fill="#a4c2ff">OPEN SOURCE · MIT · NODE ≥ 18</text>
  </g>

  <!-- Headline -->
  <text x="540" y="305" font-family="system-ui, -apple-system, 'DejaVu Sans', sans-serif" font-size="54" font-weight="700" fill="#e7ebf3" letter-spacing="-1">Turn one sentence</text>
  <text x="540" y="365" font-family="system-ui, -apple-system, 'DejaVu Sans', sans-serif" font-size="54" font-weight="700" fill="#e7ebf3" letter-spacing="-1">into a planning</text>
  <text x="540" y="425" font-family="system-ui, -apple-system, 'DejaVu Sans', sans-serif" font-size="54" font-weight="700" fill="#8ab4ff" letter-spacing="-1">foundation.</text>

  <!-- Tagline -->
  <text x="540" y="475" font-family="system-ui, -apple-system, 'DejaVu Sans', sans-serif" font-size="22" fill="#8a93a6">12 substantive Markdown files. Local-first. No build step.</text>

  <!-- Brand line -->
  <text x="540" y="555" font-family="system-ui, -apple-system, 'DejaVu Sans', sans-serif" font-size="18" font-weight="600" fill="#e7ebf3">Claude Code Public Builder Kit</text>
</svg>
